version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nawi_postgres
    environment:
      POSTGRES_DB: nawi_db
      POSTGRES_USER: nawi_user
      POSTGRES_PASSWORD: nawi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nawi_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://nawi_user:nawi_password@postgres:5432/nawi_db
      JWT_SECRET_KEY: nawi-oiml-r76-legal-metrology-secret-key-2026
    depends_on:
      - postgres
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nawi_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
